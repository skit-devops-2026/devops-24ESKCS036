
apiVersion: apps/v1
kind: Deployment
metadata:
  name: breadbasket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: breadbasket
  template:
    metadata:
      labels:
        app: breadbasket
    spec:
      containers:
        - name: breadbasket
          image: ghcr.io/akshita457/breadbasket:latest
          ports:
            - containerPort: 80
